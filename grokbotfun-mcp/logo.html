<script>
  const svg = document.querySelector('svg')
  const ghost = document.getElementById('ghost')
  const eyes = [...document.querySelectorAll('.eye')]
  const bases = eyes.map(el => [+el.dataset.x, +el.dataset.y])
  const turb = document.getElementById('turb')
  const CX = 260, CY = 260

  let mouse = null, cur = [0, 0], idleT = 0
  addEventListener('mousemove', ev => { mouse = [ev.clientX, ev.clientY] })
  document.addEventListener('mouseleave', () => { mouse = null })

  function frame(t) {
    const s = t / 1000
    let target
    if (mouse) {
      const r = svg.getBoundingClientRect()
      const dx = mouse[0] - (r.left + r.width / 2)
      const dy = mouse[1] - (r.top + r.height / 2)
      const d = Math.hypot(dx, dy) || 1
      const amp = Math.min(1, d / 280) * 7.5
      target = [dx / d * amp, dy / d * amp]
    } else {
      idleT += 0.016
      target = [Math.sin(idleT * 0.7) * 4.5, Math.cos(idleT * 0.5) * 3.4]
    }
    cur[0] += (target[0] - cur[0]) * 0.12
    cur[1] += (target[1] - cur[1]) * 0.12

    const bl = s % 3.5
    const blink = bl < 0.12 ? Math.sin(bl / 0.12 * Math.PI) : 0
    const squish = 1 - blink * 0.92

    eyes.forEach((el, i) => {
      el.setAttribute('transform',
        'translate(' + (bases[i][0] + cur[0]) + ',' + (bases[i][1] + cur[1]) + ') scale(1,' + squish + ')')
    })

    const breathe = 1 + Math.sin(s * 1.6) * 0.012
    ghost.setAttribute('transform',
      'translate(' + (CX - CX * breathe + cur[0] * 0.5) + ',' + (CY - CY * breathe + cur[1] * 0.4) + ') scale(' + breathe + ') rotate(' + (cur[0] * 0.3) + ' ' + CX + ' ' + CY + ')')

    turb.setAttribute('baseFrequency', (0.008 + Math.sin(s * 0.35) * 0.0015) + ' ' + (0.01 + Math.cos(s * 0.28) * 0.0015))

    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
</script>
